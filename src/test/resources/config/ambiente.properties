# Configuracion de ejecucion (sin secretos). Cualquier clave puede sobrescribirse con -Dclave=valor.

# Appium / dispositivo
appium.url=http://127.0.0.1:4723
plataforma=android
# UDID del dispositivo; lo entrega el menu .bat. Vacio = Appium usa el unico dispositivo conectado
device.udid=
app.package=co.com.mibanco.app
app.activity=co.com.mibanco.app.MainActivity
ambiente.nombre=Modyo certification

# Archivos de entrada
ruta.control=control/Control_Ejecucion.xlsx
ruta.pool=datos/pool_clientes.xlsx

# Salidas: cada ejecucion crea ejecuciones/AAAAMMDD_HHMMSS/
ruta.ejecuciones=ejecuciones
ruta.allure.cli=herramientas/allure-2.29.0
ruta.branding=config/branding
reporte.nombre=Automatizacion App Mi Banco - GreenSQA
reporte.idioma=es

# Reglas de datos
otp.defecto=000000
registro.max.intentos=3

# Indisponibilidad del sistema ("Validacion fallida... por este canal"): la iteracion queda CANCELADA.
# Al llegar a este numero de iteraciones canceladas se detiene la ejecucion y el resto queda PENDIENTE.
indisponibilidad.max.iteraciones=2

# Esperas explicitas (segundos)
espera.segundos=30
# Carga de la app recien abierta (WebView + Modyo)
espera.carga.app.segundos=60
# Verificacion de la pantalla actual cuando la app ya estaba en primer plano
espera.pantalla.actual.segundos=8
# Espera maxima de UiAutomator2 a que la UI quede inactiva antes de cada comando (ms)
uiautomator.idle.ms=100
